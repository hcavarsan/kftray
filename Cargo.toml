
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.dependencies]
anyhow = "1.0.104"
apple-native-keyring-store = { version = "1.0", features = ["keychain"] }
async-trait = "0.1.92"
base64 = "0.23"
bb8 = "0.9.1"
brotli = "9.0.0"
built = "0.8"
bytes = "1.12"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
crossterm = { version = "0.29", optional = false }
dashmap = "6.2"
dbus-secret-service-keyring-store = { version = "1.0", features = [
  "crypto-rust",
] }
dirs = "7.0"
env_logger = "0.11"
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs" }
flate2 = "1.1"
flexi_logger = "0.31"
futures = "0.3"
git2 = { version = "0.21", features = ["ssh", "https"] }
http = "1.5"
http-body-util = "0.1"
httparse = "1.10"
hyper = { version = "1.11.1", features = ["client", "http1", "http2", "server"] }
hyper-openssl = { version = "0.10", features = ["client-legacy"] }
hyper-util = { version = "0.1.20", features = [
  "client",
  "client-legacy",
  "client-proxy",
  "http1",
  "server",
  "tokio",
] }
insta = "1.48"
k8s-openapi = { version = "0.28.0", default-features = false, features = [
  "latest",
] }
keyring-core = "1.0"
kftray-commons = { version = "0.27.30", path = "crates/kftray-commons" }
kftray-helper = { version = "0.27.30", path = "crates/kftray-helper" }
kftray-http-logs = { version = "0.27.30", path = "crates/kftray-http-logs" }
kftray-mcp = { version = "0.27.30", path = "crates/kftray-mcp" }
kftray-network-monitor = { version = "0.27.30", path = "crates/kftray-network-monitor" }
kftray-portforward = { version = "0.27.30", path = "crates/kftray-portforward" }
kftray-shortcuts = { version = "0.27.30", path = "crates/kftray-shortcuts" }
kube = { version = "4.2.0", features = [
  "client",
  "config",
  "http-proxy",
  "oauth",
  "openssl-tls",
  "runtime",
  "rustls-tls",
  "ws",
] }
kube-runtime = { version = "4.2.0", features = ["unstable-runtime"] }
lazy_static = "1.5"
libc = "0.2.189"
linux-keyutils-keyring-store = "1.0"
log = "0.4"
mockall = "0.15"
netstat2 = "0.11.2"
once_cell = "1.21"
open = "5.4"
openssl = { version = "0.10", features = ["vendored"] }
openssl-sys = { version = "0.9", features = ["vendored"] }
pem = "4.0"
rand = "0.10"
ratatui = { version = "0.30.2", features = ["unstable-widget-ref"] }
ratatui-explorer = "0.3.0"
rcgen = "0.14"
reqwest = "0.13.4"
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "std",
  "tls12",
] }
rustls-native-certs = "0.8.4"
secrecy = "0.10"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11"
socket2 = "0.6.5"
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio",
  "sqlite",
] }
sysinfo = "0.39.6"
tar = "0.4.46"
tauri = { version = "2.11.5", default-features = false, features = [
  "devtools",
  "image-ico",
  "image-png",
  "macos-private-api",
  "tray-icon",
  "wry",
] }
tauri-build = { version = "2.6.3", features = [] }
tauri-plugin-clipboard-manager = "2.3.3"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-fs = "2.5.2"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-http = "2.6.0"
tauri-plugin-notification = "2.4.0"
tauri-plugin-os = "2.3.2"
tauri-plugin-positioner = { version = "2.3.4", features = ["tray-icon"] }
tauri-plugin-process = "2.3.1"
tauri-plugin-shell = "2.3.6"
tauri-plugin-updater = "2.11.0"
tempfile = "3.27.0"
thiserror = "2.0.20"
throbber-widgets-tui = "0.11.1"
time = "0.3"
tokio = { version = "1.53.1", features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "sync",
  "time",
] }
tokio-rustls = { version = "0.26.5", default-features = false, features = [
  "logging",
  "ring",
  "tls12",
] }
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
tower = { version = "0.5", features = ["util"] }
tower-test = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
tui-logger = "0.18"
tungstenite = { version = "0.30.0", features = ["native-tls"] }
url = "2.5.8"
uuid = { version = "1.26.0", features = ["v4"] }
whoami = "2.1.3"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_Security_Cryptography_Certificates",
  "Win32_Storage_FileSystem",
  "Win32_System_Environment",
  "Win32_System_Pipes",
  "Win32_System_Registry",
  "Win32_System_Threading",
] }
windows-native-keyring-store = "1.1"
windows-service = "0.8"

[profile.dev]
incremental = true

[profile.release]
opt-level = "s"
strip = true
lto = true
panic = "abort"
codegen-units = 1
