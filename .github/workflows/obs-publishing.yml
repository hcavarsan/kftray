name: OBS publishing

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/obs-publishing.yml"
      - "hacks/obs/**"
      - "hacks/fix_updater_json.py"
      - "hacks/tests/**"
      - "hacks/pyproject.toml"
      - "hacks/uv.lock"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/obs-publishing.yml"
      - "hacks/obs/**"
      - "hacks/fix_updater_json.py"
      - "hacks/tests/**"
      - "hacks/pyproject.toml"
      - "hacks/uv.lock"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: OBS publishing checks
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install publishing test dependencies
        run: sudo apt-get update && sudo apt-get install -y jq libxml2-utils build-essential pkg-config debhelper libdbus-1-dev rpm cpio

      - name: Check publisher scripts
        run: shellcheck hacks/obs/*.sh

      - name: Test package preparation and upload failures
        run: bash hacks/obs/test-publish.sh

      - name: Build Debian and RPM packages
        run: bash hacks/obs/test-package-builds.sh

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Test updater manifest finalization
        run: uv run --project hacks --with pytest python -m pytest hacks/tests/test_fix_updater_json.py
