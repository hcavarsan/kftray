[package]
name = "kftray-telemetry"
version = "0.30.3"
authors = ["Henrique Cavarsan <hencavarsan@gmail.com>"]
edition = "2024"
description = "Opt-in crash reporting shared by the kftray desktop app and kftui"
homepage = "https://kftray.app"
repository = "https://github.com/hcavarsan/kftray"
license = "GPL-3.0"

[dependencies]
kftray-commons = { workspace = true }
log = { workspace = true }
parking_lot = { workspace = true }
reqwest = { workspace = true }
sentry = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true, features = ["serde"] }

[dev-dependencies]
futures = { workspace = true }
sentry = { workspace = true, features = ["test"] }
tokio = { workspace = true }
