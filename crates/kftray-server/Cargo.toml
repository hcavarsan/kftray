[package]
name = "kftray-server"
version = "0.27.30"
authors = ["Henrique Cavarsan <hencavarsan@gmail.com>"]
edition = "2024"
description = "KFtray Server is a Rust application that relays UDP/TCP traffic to an upstream server"
homepage = "https://kftray.app"
repository = "https://github.com/hcavarsan/kftray"
license = "GPL-3.0"

[dependencies]
async-trait = "0.1.92"
bytes = "1.12"
env_logger = "0.11.11"
futures = "0.3"
http = "1.5"
http-body-util = "0.1"
hyper = { version = "1.11.1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
log = "0.4.34"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
socket2 = "0.6.5"
tokio = { version = "1.53.1", features = ["full", "macros", "rt-multi-thread"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tungstenite = "0.30.0"
url = "2.5.8"
uuid = { version = "1.26", features = ["v4"] }

[dev-dependencies]
lazy_static = "1.5.0"
