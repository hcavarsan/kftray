# shellcheck disable=SC2148
# Distribution configuration
# Format: DISTRO_NAME OBS_PROJECT REPOSITORY ARCHITECTURES (whitespace separated)
#
# publish.sh replaces the OBS project's repository list with this file on every
# run. Every target listed here must build successfully for a release to pass.
# Prebuilt binaries need glibc 2.35 or newer (Ubuntu 22.04, Debian 12).

# Ubuntu LTS versions
Ubuntu_26.04        Ubuntu:26.04         standard x86_64,aarch64
Ubuntu_24.04        Ubuntu:24.04         standard x86_64,aarch64
Ubuntu_22.04        Ubuntu:22.04         standard x86_64,aarch64

# Debian stable
Debian_13           Debian:13            standard x86_64,aarch64
Debian_12           Debian:12            standard x86_64,aarch64

# Fedora supported releases
Fedora_44           Fedora:44            standard x86_64,aarch64
Fedora_43           Fedora:43            standard x86_64,aarch64

# openSUSE
openSUSE_Tumbleweed openSUSE:Tumbleweed  standard x86_64,aarch64
openSUSE_Leap_16.0  openSUSE:Leap:16.0   standard x86_64,aarch64
